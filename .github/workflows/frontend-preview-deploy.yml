name: Frontend Preview Deploy

on:
  push:
    branches:
      - 'main'
      - 'feature/king-inspector-mainline'
      - 'feature/family-games-mashaal-integration-v1'
      - 'feature/product-ui-reference-v1'
    paths:
      - 'preview-v4/**'
      - 'tools/build-web-preview.mjs'
      - 'wrangler.frontend-preview.jsonc'
      - '.github/workflows/frontend-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-preview-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      cloudflare_available: ${{ steps.host.outputs.cloudflare_available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect preferred preview host
        id: host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "cloudflare_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token unavailable; GitHub Pages fallback will be used."
          fi

      - name: Test learning app
        run: npm test
        working-directory: preview-v4

      - name: Build verified Itqan CMS same-track catalog
        working-directory: preview-v4
        run: |
          node tools/build-itqan-cms-tracks.mjs
          node tools/build-quran-svg-pages.mjs
          node tools/verify-quran-itqan-coverage.mjs
          node tools/build-quran-isolated-views.mjs
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const catalog=JSON.parse(await readFile('assets/recitation/itqan-hafs-tracks.json','utf8'));
          const required=[1,...Array.from({length:22},(_,i)=>93+i),32,33,34,35,36,37,38,67,68];
          if(required.some(s=>!catalog.tracks[String(s)]))throw new Error('Missing Quran school chapter from CMS');
          console.log('Itqan same-track recordings checked for all learners:',required.length,'surahs');
          NODE
      - name: Build isolated web preview
        run: node tools/build-web-preview.mjs

      - name: Rotate preview Quran PWA cache on this release
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const sha=String(process.env.GITHUB_SHA||'').slice(0,12);
          if(!/^[a-f0-9]{12}$/.test(sha))throw new Error('Missing immutable GitHub commit SHA');
          const path='dist-web-preview/service-worker.js';
          let sw=await readFile(path,'utf8');
          const previous='const CACHE_VERSION=`${CACHE_PREFIX}shell-230`;';
          const next='const CACHE_VERSION=`${CACHE_PREFIX}shell-quran-itqan-'+sha+'`;';
          if(sw.split(previous).length!==2)throw new Error('Unexpected service worker version: refusing stale release');
          sw=sw.replace(previous,next);
          const shell='const APP_SHELL=[';
          if(sw.split(shell).length!==2)throw new Error('Unexpected service worker shell');
          sw=sw.replace(shell,shell+"\n  './assets/recitation/itqan-hafs-tracks.json',\n  './assets/recitation/quran-course-page-map.json',\n  './src/shared/quran/quran-course-page-map.js',\n  './src/shared/quran/quran-practice-cloud-sync.js',\n  './src/shared/quran/quran-instruction-voice.js',\n  './src/shared/quran/itqan-catalog-source.js',\n  './src/shared/quran/quran-svg-ayah-polygons.js',\n  './src/shared/quran/quran-svg-page-index.js',");
          await writeFile(path,sw);
          const importedPath='dist-web-preview/service-worker-runtime.js';
          const runtime=await readFile(importedPath,'utf8');
          await writeFile(importedPath,runtime+'\n// itqan-quran-release-'+sha+'\n');
          console.log('Quran PWA cache version rotated to',sha);
          NODE
      - name: Verify release URLs bypass old iOS PWA caches
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const sha=process.env.GITHUB_SHA.slice(0,12);
          const root='dist-web-preview/';
          const html=readFileSync(root+'index.html','utf8');
          const main=readFileSync(root+'src/main.js','utf8');
          const startup=readFileSync(root+'src/startup-shell.js','utf8');
          const hub=readFileSync(root+'src/modules/hub/learner-hub-registry.js','utf8');
          const meta=JSON.parse(readFileSync(root+'deployment-meta.json','utf8'));
          for(const entry of ['src/startup-shell.js','src/main.js'])
            if(!html.includes(entry+'?release='+sha))throw new Error('Entry not cache-busted: '+entry);
          for(const [source,required] of [[main,"./startup-shell.js?release="],[main,"./modules/hub/learner-hub-registry.js?release="],[startup,"./modules/hub/learner-hub-registry.js?release="],[hub,"open-family-learner-grid.css?release="]])
            if(!source.includes(required+sha))throw new Error('Stale import/style remains: '+required);
          if(meta.release!==sha)throw new Error('Mismatched deployment release');
          console.log('All PWA escape paths point to release',sha);
          NODE

      - name: Verify preview isolation
        run: |
          node --input-type=module <<'NODE'
          import * as fs from 'node:fs';
          const html=fs.readFileSync('dist-web-preview/index.html','utf8');
          const meta=JSON.parse(fs.readFileSync('dist-web-preview/deployment-meta.json','utf8'));
          if(!html.includes('__FAMILY_API_BASE_URL__="https://yasser-khaled-family-api.modynawe.workers.dev"'))throw new Error('Published family API bootstrap is missing');
          if(meta.mode!='web-production'||meta.cloudSync!==true)throw new Error('Published deployment metadata is invalid');
          const catalog=JSON.parse(fs.readFileSync('dist-web-preview/assets/recitation/itqan-hafs-tracks.json','utf8'));
          if(catalog.schemaVersion!==1||!Object.keys(catalog.tracks||{}).length)throw new Error('Itqan same-track catalog missing from production preview');
          const map=JSON.parse(fs.readFileSync('dist-web-preview/assets/recitation/quran-course-page-map.json','utf8'));
          if(map.schemaVersion!==1||Object.keys(map.surahs||{}).length!==32)
            throw new Error('Verified all-learner source course page map is missing');
          const {collectRequiredQuranPages}=await import('./preview-v4/tools/build-quran-svg-pages.mjs');
          for(const n of collectRequiredQuranPages()){
            const asset='dist-web-preview/assets/recitation/kfqc-hafs-page-'+n+'.svg';
            if(!fs.existsSync(asset)||!fs.readFileSync(asset,'utf8').includes('ayahPolygon'))
              throw new Error('Verified bundled Hafs page missing from preview: '+n);
          }
          if(fs.existsSync('dist-web-preview/tests')||fs.existsSync('dist-web-preview/tools')||fs.existsSync('dist-web-preview/docs'))throw new Error('Non-runtime files leaked into preview package');
          NODE

      - name: Upload reusable preview package
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-package
          path: dist-web-preview
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  cloudflare:
    needs: build
    if: needs.build.outputs.cloudflare_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
      PREVIEW_URL: https://family-learning-preview.modynawe.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-preview-package
          path: dist-web-preview

      - name: Deploy static PWA preview to Cloudflare
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.frontend-preview.jsonc

      - name: Smoke test Cloudflare preview
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          # Cloudflare may take a short time to serve a just-deployed release at all edges.
          # Retry the release signature, not merely HTTP errors; never accept stale HTML.
          verified=false
          for attempt in $(seq 1 20); do
            curl -fsSL --max-time 20 "$PREVIEW_URL/deployment-meta.json?verify=$SHA-$attempt" -o /tmp/family-live-meta.json || true
            curl -fsSL --max-time 20 "$PREVIEW_URL/?verify=$SHA-$attempt" -o /tmp/family-live-index.html || true
            if grep -Fq "\"release\": \"$SHA\"" /tmp/family-live-meta.json 2>/dev/null &&
               grep -Fq "src/main.js?release=$SHA" /tmp/family-live-index.html 2>/dev/null &&
               grep -Fq 'تعلم العائلة' /tmp/family-live-index.html 2>/dev/null; then
              verified=true
              break
            fi
            sleep 2
          done
          if [ "$verified" != true ]; then
            echo "Cloudflare preview did not expose expected release $SHA"
            cat /tmp/family-live-meta.json || true
            exit 1
          fi
          echo "Verified Cloudflare preview release: $SHA"
          # Every learner entrypoint and stylesheet must carry the exact same version.
          curl -fsSL "$PREVIEW_URL/src/main.js?verify=$SHA" -o /tmp/family-live-main.js
          for entry in yasser/ui/yasser-home-shell.js khaled/ui/khaled-home-shell.js mashaal/ui/mashaal-shell.js; do
            grep -Fq "$entry?release=$SHA" /tmp/family-live-main.js
          done
          for asset in "yasser/ui/yasser-home-shell.js|yasser/ui/yasser-home.css" "khaled/ui/khaled-home-shell.js|khaled/ui/khaled-subject-gateway.css" "mashaal/ui/mashaal-shell.js|mashaal/ui/mashaal-home.css"; do
            js="${asset%%|*}"
            css="${asset#*|}"
            curl -fsSL "$PREVIEW_URL/src/modules/$js?verify=$SHA" -o /tmp/family-live-inner.js
            grep -Fq "$css?release=$SHA" /tmp/family-live-inner.js
            curl -fsSL "$PREVIEW_URL/src/modules/$css?verify=$SHA" -o /tmp/family-live-inner.css
            grep -Fq 'Family worlds:' /tmp/family-live-inner.css
          done
          # Fetch the whole response before grep: grep -q can close the pipe early
          # and make curl fail with exit 23 under pipefail (a false deployment failure).
          assert_live_text() {
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL/$1" -o /tmp/family-assert-live-body
            grep -Fq "$2" /tmp/family-assert-live-body
          }
          assert_live_text src/main.js "learner-hub-registry.js?release=$SHA"
          assert_live_text src/modules/hub/learner-hub-registry.js "open-family-learner-grid.css?release=$SHA"
          assert_live_text src/modules/hub/open-family-learner-grid.css "Family worlds v1"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL/manifest.webmanifest" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL/service-worker.js" -o /dev/null
          assert_live_text deployment-meta.json '"cloudSync": true'
          assert_live_text assets/recitation/quran-course-page-map.json '"sourcePin"'
          for n in 1 415 453 564 602 603 604; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL/assets/recitation/kfqc-hafs-page-$n.svg" > /dev/null
          done

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages-preview-product-ui
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-preview-package
          path: dist-web-preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web-preview

      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test GitHub Pages preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          BASE="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/" | grep -q 'تعلم العائلة'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/manifest.webmanifest" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/service-worker.js" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/deployment-meta.json" | grep -q '"cloudSync": true'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/assets/recitation/quran-course-page-map.json" | grep -q '"sourcePin"'
          for n in 1 415 453 564 602 603 604; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/assets/recitation/kfqc-hafs-page-$n.svg" > /dev/null
          done

# manual deploy trigger: science integration 2026-09-11
