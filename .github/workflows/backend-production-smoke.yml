name: Backend Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/games-platform-v1'
    paths:
      - '.github/workflows/backend-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://yasser-khaled-family-api.modynawe.workers.dev
    steps:
      - name: Verify live family API, cloud boundary, and XO room lifecycle
        run: |
          node <<'NODE'
          const base=process.env.API_BASE;
          async function raw(path,{method='GET',body,token,origin='capacitor://localhost',authorization}={}){
            const headers={accept:'application/json',origin};
            if(body!==undefined)headers['content-type']='application/json';
            if(token)headers['x-game-token']=token;
            if(authorization)headers.authorization=authorization;
            const response=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            const text=await response.text();let payload=null;try{payload=JSON.parse(text);}catch{}
            console.log(`${method} ${path} -> ${response.status} ${text.slice(0,400)}`);
            console.log(`cors=${response.headers.get('access-control-allow-origin')||''}`);
            return {response,payload};
          }
          const health=await raw('/health');
          if(!health.response.ok||health.payload?.ok!==true)throw new Error('production health failed');
          if(health.response.headers.get('access-control-allow-origin')!=='capacitor://localhost')throw new Error('Capacitor CORS is not enabled in production');

          const invalidRegistration=await raw('/v1/auth/register',{method:'POST',body:{email:'invalid',password:'short'}});
          if(invalidRegistration.response.status!==400||invalidRegistration.payload?.error!=='invalid_credentials_format')throw new Error('production parent auth route is not active');
          const protectedSnapshot=await raw('/v1/sync/snapshot');
          if(protectedSnapshot.response.status!==401||protectedSnapshot.payload?.error!=='unauthorized')throw new Error('production cloud sync protection is not active');
          console.log('LIVE_CLOUD_BOUNDARY_OK');

          const host=await raw('/v1/games/rooms',{method:'POST',body:{gameId:'xo',learnerId:'yasser'}});
          if(host.response.status!==201)throw new Error(`XO room create unavailable (${host.response.status})`);
          const code=host.payload?.room?.code,hostToken=host.payload?.playerToken;
          if(!/^\d{6}$/.test(code||'')||!hostToken)throw new Error('host room contract failed');
          const guest=await raw('/v1/games/rooms/join',{method:'POST',body:{code,learnerId:'khaled'}});
          if(!guest.response.ok||guest.payload?.room?.status!=='playing'||guest.payload?.room?.players?.length!==2)throw new Error('second device join failed');
          const read=await raw(`/v1/games/rooms/${code}`,{token:hostToken});
          if(!read.response.ok||read.payload?.room?.players?.length!==2)throw new Error('room token read failed');
          console.log(`LIVE_XO_OK room=${code}`);
          NODE
