name: Mashaal Uploaded Preview QA

on:
  push:
    branches:
      - feature/family-games-mashaal-integration-v1
    paths:
      - '.github/workflows/mashaal-visual-build.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-games-mashaal-integration-v1
      - name: Package exact uploaded preview
        uses: actions/upload-artifact@v4
        with:
          name: mashaal-uploaded-preview
          path: preview-v4
          include-hidden-files: true
          retention-days: 1
