name: Provision Pinned UI Agent Skills

on:
  push:
    branches:
      - feature/product-ui-reference-v1
    paths:
      - '.github/workflows/provision-ui-agent-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provision-ui-agent-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/feature/product-ui-reference-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Taste Skill and Image to Code from original authors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/family-ui-skills/taste /tmp/family-ui-skills/images .agents/skills
          curl --fail --location --silent --show-error --retry 3 \
            https://codeload.github.com/Leonxlnx/taste-skill/tar.gz/12af471f627f866411b4bd785b19646d3672784c \
            | tar -xz --strip-components=1 -C /tmp/family-ui-skills/taste
          curl --fail --location --silent --show-error --retry 3 \
            https://codeload.github.com/Leonxlnx/imagegen-skills/tar.gz/beb16b0d0f4dae9a6f5cb04ea41e97b93a54ab8e \
            | tar -xz --strip-components=1 -C /tmp/family-ui-skills/images
          mkdir -p .agents/skills/design-taste-frontend .agents/skills/image-to-code
          cp -R /tmp/family-ui-skills/taste/skills/taste-skill/. .agents/skills/design-taste-frontend/
          cp -R /tmp/family-ui-skills/images/skills/image-to-code/. .agents/skills/image-to-code/
          test -s .agents/skills/design-taste-frontend/SKILL.md
          test -s .agents/skills/design-taste-frontend/library/sites.json
          test -s .agents/skills/design-taste-frontend/scripts/inspect.mjs
          test -s .agents/skills/image-to-code/SKILL.md
          grep -q '^name: design-taste-frontend' .agents/skills/design-taste-frontend/SKILL.md
          grep -q '^name: image-to-code' .agents/skills/image-to-code/SKILL.md
      - name: Install official Microsoft Playwright CLI and its workspace skill
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @playwright/cli@0.1.23
          playwright-cli --help >/tmp/family-playwright-cli-help.txt
          playwright-cli install --skills=agents
          test -s .agents/skills/playwright-cli/SKILL.md
          grep -q '^name: playwright-cli' .agents/skills/playwright-cli/SKILL.md
          test -s .agents/skills/playwright-cli/references/playwright-tests.md
      - name: Check installed skills without changing application code
        shell: bash
        run: |
          set -euo pipefail
          node --check .agents/skills/design-taste-frontend/scripts/draw.mjs
          node --check .agents/skills/design-taste-frontend/scripts/inspect.mjs
          node --check .agents/skills/design-taste-frontend/scripts/lint.mjs
          node -e "const fs=require('fs'); for (const f of fs.readdirSync('.agents/skills/design-taste-frontend/library')) if (f.endsWith('.json')) JSON.parse(fs.readFileSync('.agents/skills/design-taste-frontend/library/'+f,'utf8')); console.log('Taste library valid JSON')"
          node --test preview-v4/tests/live-entrypoint.test.mjs
          cat > .agents/skills/INSTALL-SOURCES.md <<'EOF'
          # Installed skills — source pins
          - design-taste-frontend: https://github.com/Leonxlnx/taste-skill at 12af471f627f866411b4bd785b19646d3672784c (full skills/taste-skill/ directory)
          - image-to-code: https://github.com/Leonxlnx/imagegen-skills at beb16b0d0f4dae9a6f5cb04ea41e97b93a54ab8e (skills/image-to-code/)
          - playwright-cli: Microsoft @playwright/cli npm version 0.1.23, installed with `playwright-cli install --skills=agents`.
          - Project rule: refer to root AGENTS.md; do not rebuild or restyle working UI without a task, and verify changes before deployment.
          EOF
      - name: Commit skills to existing work branch
        shell: bash
        run: |
          set -euo pipefail
          git add .agents/skills/design-taste-frontend .agents/skills/image-to-code .agents/skills/playwright-cli .agents/skills/INSTALL-SOURCES.md
          # Upstream Image to Code Markdown intentionally uses two-space line breaks.
          # Preserve vendor files byte-for-byte and check only locally authored metadata.
          git diff --cached --check -- .agents/skills/INSTALL-SOURCES.md
          if git diff --cached --quiet; then
            echo "Pinned skill packages already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(skills): install Taste, Image to Code and Microsoft Playwright CLI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
