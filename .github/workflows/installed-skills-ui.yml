name: Installed Skills - Web UI Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/product-ui-reference-v1
      - feature/mainline-release-family-ui-20261102
    paths:
      - '.agents/skills/**'
      - '.github/workflows/installed-skills-ui.yml'
      - 'preview-v4/tools/skill-webapp-smoke.py'
      - 'preview-v4/src/modules/hub/learning-shell.js'
      - 'preview-v4/src/modules/hub/open-family-learner-grid.css'
      - 'preview-v4/src/modules/yasser/ui/yasser-home.css'
      - 'preview-v4/src/modules/khaled/ui/khaled-subject-gateway.css'
      - 'preview-v4/src/modules/mashaal/ui/mashaal-home.css'
      - 'preview-v4/tools/internal-worlds-smoke.py'

permissions:
  contents: read

jobs:
  webapp-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify installed Codex skills
        run: |
          test -s .agents/skills/webapp-testing/SKILL.md
          test -s .agents/skills/webapp-testing/scripts/with_server.py
          test -s .agents/skills/web-design-guidelines/SKILL.md
          python3 .agents/skills/webapp-testing/scripts/with_server.py --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate merged production build and retained Quran sources
        run: |
          cd preview-v4
          node tools/build-itqan-cms-tracks.mjs
          node tools/build-quran-svg-pages.mjs
          node tools/verify-quran-itqan-coverage.mjs
          node tools/build-quran-isolated-views.mjs
          cd ..
          node tools/build-web-preview.mjs
          test -s dist-web-preview/deployment-meta.json
          grep -Fq "release=${GITHUB_SHA:0:12}" dist-web-preview/index.html
          test -s dist-web-preview/src/modules/mashaal/quran/quran-surah-player.js
          test -s dist-web-preview/src/modules/games/king-inspector/king-inspector-controller.js
      - name: Install Playwright and Chromium / WebKit
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium webkit
      - name: Exercise family app in real browsers
        run: |
          python3 .agents/skills/webapp-testing/scripts/with_server.py \
            --server 'python3 -m http.server 8790 --bind 127.0.0.1 --directory dist-web-preview 2>/tmp/family-skills-http.log' \
            --port 8790 \
            -- python3 preview-v4/tools/skill-webapp-smoke.py
          python3 .agents/skills/webapp-testing/scripts/with_server.py \
            --server 'python3 -m http.server 8790 --bind 127.0.0.1 --directory dist-web-preview 2>/tmp/family-skills-http-inner.log' \
            --port 8790 \
            -- python3 preview-v4/tools/internal-worlds-smoke.py
      - name: Upload UI results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-skills-ui-audit
          path: /tmp/family-skill-audit
          retention-days: 7
          if-no-files-found: warn
