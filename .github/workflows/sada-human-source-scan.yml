name: SADA Human Source Selection

on:
  push:
    branches:
      - 'feature/games-platform-v1'
    paths:
      - '.github/workflows/sada-human-source-scan.yml'
      - 'preview-v4/tools/sada-human-source.mjs'
      - 'preview-v4/tools/voice/sada-source-config.mjs'
      - 'preview-v4/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select one clean adult male Najdi source and download bounded clips
        run: npm run voice:sada:download
        working-directory: preview-v4
      - name: Upload selected human source
        uses: actions/upload-artifact@v4
        with:
          name: sada-human-source-selection
          path: preview-v4/build/voice/sada/
          if-no-files-found: error
          retention-days: 7
