name: Quran Verse Range Smoke (isolated branch)
on:
  push:
    branches:
      - feature/quran-learning-range-progress-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Itqan source
        run: |
          cd preview-v4
          node tools/build-itqan-cms-tracks.mjs
          cd ..
          node tools/build-web-preview.mjs
      - name: Prepare Chromium and WebKit
        working-directory: preview-v4
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Test selected range, three repeats and saved practice
        run: |
          python3 -m http.server 8790 --bind 127.0.0.1 --directory dist-web-preview >/tmp/quran-practice-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..15}; do curl -fsS http://127.0.0.1:8790/ >/dev/null && break || sleep 1; done
          cd preview-v4
          node tools/quran-guided-practice-browser.mjs
