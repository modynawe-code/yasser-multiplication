name: Patch Science Journey Entry
on:
  push:
    branches: [feature/product-ui-reference-v1]
    paths:
      - '.github/workflows/patch-science-journey-entry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-ui-reference-v1
      - name: Wire journey module into preview shell
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('preview-v4/index.html')
          text=path.read_text()
          marker='<script type="module" src="src/main.js"></script>'
          addition=marker+'<script type="module" src="src/modules/yasser/science/science-journey.js"></script>'
          if 'src/modules/yasser/science/science-journey.js' not in text:
              if marker not in text:
                  raise SystemExit('main.js marker not found')
              text=text.replace(marker,addition,1)
              path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v4/index.html
          git commit -m "feat(science): wire journey map into preview"
          git push
