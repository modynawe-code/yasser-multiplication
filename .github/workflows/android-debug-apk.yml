name: Android Debug APK
# Stable signing persistence verification: cache key v1.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'preview-v4/**'
      - 'mobile-assets/**'
      - 'tools/build-mobile.mjs'
      - 'tools/prepare-mobile-assets.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yasser-khaled-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install mobile toolchain
        run: npm install --no-audit --no-fund

      - name: Verify learning app
        run: npm test
        working-directory: preview-v4

      - name: Prepare bundled web app
        run: npm run mobile:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Sync bundled web app
        run: npx cap sync android

      - name: Force generated Android debug build to stable signer
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  stableDebug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          GRADLE

      - name: Generate Android launcher icon
        run: npm run android:assets

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Verify APK signing identity
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$HOME/.android/debug.keystore"
          test -f "$APK"
          test -n "$APKSIGNER"

          KEYSTORE_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          APK_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' signing-report.txt | head -n 1 | tr 'A-F' 'a-f')"

          test -n "$KEYSTORE_SHA256"
          test -n "$APK_SHA256"
          test "$KEYSTORE_SHA256" = "$APK_SHA256"
          echo "APK_CERT_SHA256=$APK_SHA256"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: yasser-khaled-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
