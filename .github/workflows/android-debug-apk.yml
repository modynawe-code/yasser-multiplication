name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'preview-v4/**'
      - 'mobile-assets/**'
      - 'tools/build-mobile.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile toolchain
        run: npm install --no-audit --no-fund

      - name: Verify learning app
        run: npm test
        working-directory: preview-v4

      - name: Prepare bundled web app
        run: npm run mobile:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Sync bundled web app
        run: npx cap sync android

      - name: Generate Android launcher icon
        run: npm run android:assets

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: yasser-khaled-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
