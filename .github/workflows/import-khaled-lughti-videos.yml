name: Import Khaled Lughti videos

on:
  push:
    branches:
      - 'feature/khaled-lughti-two-videos-20261005'
    paths:
      - '.github/workflows/import-khaled-lughti-videos.yml'

permissions:
  contents: write

jobs:
  import-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize uploaded MP4 blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p preview-v4/assets/khaled/literacy

          fetch_blob () {
            local sha="$1"
            local out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/git/blobs/$sha" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode > "$out"
          }

          fetch_blob "9814fb85e95411da0d0df12001634559a19307c5" "preview-v4/assets/khaled/literacy/syllable-spelling.mp4"
          fetch_blob "613236a88b55cb89154e3c0ad86c915ec141f39f" "preview-v4/assets/khaled/literacy/unit-1-letters-sounds-review.mp4"

          echo "0e4b4519563f8105a6ef000114ccfccfacfdcd5a485ad98071465335390ec398  preview-v4/assets/khaled/literacy/syllable-spelling.mp4" | sha256sum -c -
          echo "fe2c093466468949cc331f79f28363b41b0261438bbe1f54ebe26e6d51d49057  preview-v4/assets/khaled/literacy/unit-1-letters-sounds-review.mp4" | sha256sum -c -

      - name: Commit imported videos and remove temporary payloads
        run: |
          set -euo pipefail
          rm -f \
            preview-v4/assets/khaled/literacy/.video-upload-test.txt \
            preview-v4/assets/khaled/literacy/.video-byte-test.txt \
            preview-v4/assets/khaled/literacy/syllable-spelling.u32p01.txt \
            .github/workflows/import-khaled-lughti-videos.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add two Khaled Lughti videos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
