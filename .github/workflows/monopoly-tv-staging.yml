name: Monopoly TV Isolated Cloudflare Staging
on:
  push:
    branches:
      - feature/monopoly-tv-multiscreen-v1
    paths:
      - 'preview-v4/monopoly-party/**'
      - 'tools/monopoly-tv-renderer/**'
      - 'preview-v4/tools/monopoly-tv-live-qa.py'
      - 'backend/src/game-room-rules.mjs'
      - 'preview-v4/src/modules/games/monopoly/monopoly-engine.js'
      - 'tools/monopoly-tv-staging.mjs'
      - 'preview-v4/tools/monopoly-tv-live-qa.py'
      - '.github/workflows/monopoly-tv-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monopoly-tv-isolated-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Cloudflare staging access
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Cloudflare staging token unavailable"; exit 1; }
      - name: Verify TV state and permission tests
        run: node --test preview-v4/tests/monopoly-party.test.mjs
      - name: Build isolated frontend and configure separate Cloudflare D1
        run: |
          node tools/build-web-preview.mjs
          node tools/monopoly-tv-staging.mjs
      - name: Bundle local PixiJS and GSAP renderer (no external runtime CDN)
        run: |
          npm install --prefix tools/monopoly-tv-renderer --ignore-scripts --no-audit --no-fund
          node tools/monopoly-tv-renderer/build.mjs dist-web-preview/monopoly-party/vendor/cinematic-scene.mjs
          test -s dist-web-preview/monopoly-party/vendor/cinematic-scene.mjs
      - name: Audit staging API bootstrap
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const base='dist-web-preview/';
          for(const path of ['monopoly-party/tv/index.html','monopoly-party/controller/index.html','index.html']){
            if(!readFileSync(base+path,'utf8').includes('https://monopoly-tv-api-staging.modynawe.workers.dev'))
              throw new Error('Staging page lacks isolated API: '+path);
          }
          NODE
      - name: Apply game schema only to staging D1
        run: npx --yes wrangler@4.129.0 d1 migrations apply monopoly-tv-staging-v1 --remote --config backend/wrangler.tv-staging.jsonc
      - name: Deploy separate staging game API
        run: npx --yes wrangler@4.129.0 deploy --config backend/wrangler.tv-staging.jsonc
      - name: Deploy separate TV and controller site
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.monopoly-tv-staging.jsonc
      - name: Verify deployed routes and real room permissions
        env:
          TV_LOCAL_API: https://monopoly-tv-api-staging.modynawe.workers.dev
          TV_TEST_ORIGIN: https://monopoly-tv-staging.modynawe.workers.dev
        run: |
          set -euo pipefail
          WEB="$TV_TEST_ORIGIN"
          API="$TV_LOCAL_API"
          SHA="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 15); do
            curl -fsSL "$WEB/monopoly-party/staging-meta.json?verify=$SHA-$attempt" -o /tmp/monopoly-stage-meta.json || true
            if grep -Fq "\"release\": \"$SHA\"" /tmp/monopoly-stage-meta.json; then break; fi
            sleep 2
          done
          grep -Fq "\"release\": \"$SHA\"" /tmp/monopoly-stage-meta.json
          for route in tv controller; do
            curl -fsSL "$WEB/monopoly-party/$route/" -o "/tmp/monopoly-$route.html"
            grep -Fq "$API" "/tmp/monopoly-$route.html"
          done
          curl -fsSL "$WEB/monopoly-party/vendor/qrcode.mjs" -o /tmp/monopoly-tv-qr.mjs
          curl -fsSL "$WEB/monopoly-party/tv/tv.js" -o /tmp/monopoly-tv-client.mjs
          curl -fsSL "$WEB/monopoly-party/controller/remote.js" -o /tmp/monopoly-phone-client.mjs
          node preview-v4/tools/monopoly-tv-backend-qa.mjs
      - name: Install browser runtimes for real TV + phone staging acceptance
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium webkit
      - name: Play full real-room interactions in Chromium and mobile Safari
        env:
          TV_TEST_ORIGIN: https://monopoly-tv-staging.modynawe.workers.dev
        run: python3 preview-v4/tools/monopoly-tv-live-qa.py
      - name: Upload real staging screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monopoly-tv-live-staging
          path: /tmp/monopoly-tv-live-qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Staging entrypoints
        if: always()
        run: |
          echo "TV: https://monopoly-tv-staging.modynawe.workers.dev/monopoly-party/tv/" >> "$GITHUB_STEP_SUMMARY"
          echo "Phone: https://monopoly-tv-staging.modynawe.workers.dev/monopoly-party/controller/" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated from production family database." >> "$GITHUB_STEP_SUMMARY"
