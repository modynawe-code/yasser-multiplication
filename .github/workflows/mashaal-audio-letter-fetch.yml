name: Mashaal Arabic Letter Audio Fetch

on:
  push:
    branches:
      - work/mashaal-qatar-letter-audio-v1
    paths:
      - '.github/workflows/mashaal-audio-letter-fetch.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download official per-letter audio and glyphs
        run: |
          set -e
          mkdir -p /tmp/qatar-letters/audio-qasr /tmp/qatar-letters/audio-mad /tmp/qatar-letters/glyphs
          for i in $(seq 1 29); do
            curl -fL --retry 3 --retry-delay 1               "https://alquran.islam.gov.qa/droos/Sounds/Dr1/D1_B%20($i).mp3"               -o "/tmp/qatar-letters/audio-qasr/$i.mp3"
            curl -fL --retry 3 --retry-delay 1               "https://alquran.islam.gov.qa/droos/Sounds/Dr1/D1_A%20($i).mp3"               -o "/tmp/qatar-letters/audio-mad/$i.mp3"
            curl -fL --retry 3 --retry-delay 1               "https://alquran.islam.gov.qa/droos/img/Dr1/D1_$i.svg"               -o "/tmp/qatar-letters/glyphs/$i.svg"
            q=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/qatar-letters/audio-qasr/$i.mp3")
            m=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/qatar-letters/audio-mad/$i.mp3")
            printf '%02d qasr=%s mad=%s\n' "$i" "$q" "$m" | tee -a /tmp/qatar-letters/durations.txt
          done
      - name: Upload official per-letter bundle
        uses: actions/upload-artifact@v4
        with:
          name: mashaal-qatar-per-letter-source
          path: /tmp/qatar-letters/
          retention-days: 1
