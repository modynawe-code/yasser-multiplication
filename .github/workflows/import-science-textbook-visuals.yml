name: Import Science Textbook Visuals

on:
  push:
    branches: [feature/product-ui-reference-v1]
    paths:
      - '.github/workflows/import-science-textbook-visuals.yml'
      - 'preview-v4/tools/import-science-textbook-visuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-textbook-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-ui-reference-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow requests
      - name: Extract hand-verified chapter-one figures from textbook PDF
        run: python preview-v4/tools/import-science-textbook-visuals.py
      - name: Upload crop contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: science-textbook-contact-sheet
          path: /tmp/science-textbook-contact-sheet.jpg
          retention-days: 3
      - name: Commit textbook visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v4/assets/science/yasser/book preview-v4/src/modules/yasser/science/science-book-visuals.generated.js
          if git diff --cached --quiet; then
            echo "Textbook visuals already current."
            exit 0
          fi
          git commit -m "chore: vendor hand-verified science textbook figures"
          git pull --rebase origin feature/product-ui-reference-v1
          git push origin HEAD:feature/product-ui-reference-v1
