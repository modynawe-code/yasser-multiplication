name: Backend Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/product-ui-reference-v1'
    paths:
      - '.github/backend-production-deploy-trigger'

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
      API_BASE: https://yasser-khaled-family-api.modynawe.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Apply production D1 migrations
        run: npx --yes wrangler@4.129.0 d1 migrations apply yasser-khaled-family --remote --config wrangler.jsonc
        working-directory: backend

      - name: Deploy production Worker
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.jsonc
        working-directory: backend

      - name: Production health and games smoke tests
        run: |
          node <<'NODE'
          const base=process.env.API_BASE;
          async function request(path,{method='GET',body,token}={}){
            const headers={accept:'application/json',origin:'capacitor://localhost'};
            if(body!==undefined)headers['content-type']='application/json';
            if(token)headers['x-game-token']=token;
            const response=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            let payload=null;try{payload=await response.json();}catch{}
            if(!response.ok)throw new Error(`${method} ${path} -> ${response.status} ${JSON.stringify(payload)}`);
            return payload;
          }
          const health=await request('/health');
          if(health?.ok!==true)throw new Error('Production health payload is not ok');

          const xoHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'xo',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(xoHost?.room?.code||''))throw new Error('XO room code contract failed');
          if(xoHost?.room?.status!=='waiting'||!xoHost?.playerToken)throw new Error('XO host room contract failed');
          const xoGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:xoHost.room.code,learnerId:'khaled'}});
          if(xoGuest?.room?.status!=='playing'||xoGuest?.room?.players?.length!==2||!xoGuest?.playerToken)throw new Error('XO second-device join contract failed');
          const xoRefreshed=await request(`/v1/games/rooms/${xoHost.room.code}`,{token:xoHost.playerToken});
          if(xoRefreshed?.room?.status!=='playing'||xoRefreshed?.room?.players?.length!==2)throw new Error('XO authenticated room read contract failed');

          const rpsHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'rock-paper-scissors',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(rpsHost?.room?.code||''))throw new Error('RPS room code contract failed');
          const rpsGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:rpsHost.room.code,learnerId:'khaled'}});
          if(rpsGuest?.room?.status!=='playing'||rpsGuest?.room?.state?.phase!=='choosing')throw new Error('RPS join contract failed');
          const hostPlayerId=rpsHost.room.selfPlayerId;
          const guestPlayerId=rpsGuest.room.selfPlayerId;
          const hostChoice=await request(`/v1/games/rooms/${rpsHost.room.code}/actions`,{method:'POST',token:rpsHost.playerToken,body:{expectedVersion:rpsGuest.room.version,type:'choose',choice:'rock'}});
          if(hostChoice?.room?.state?.choices?.[hostPlayerId]!=='rock')throw new Error('RPS host must see its own private choice');
          const guestView=await request(`/v1/games/rooms/${rpsHost.room.code}`,{token:rpsGuest.playerToken});
          if(guestView?.room?.state?.choices?.[hostPlayerId])throw new Error('RPS private choice leaked to opponent');
          if(!(guestView?.room?.state?.chosenPlayers||[]).includes(hostPlayerId))throw new Error('RPS choice readiness was not exposed safely');
          const reveal=await request(`/v1/games/rooms/${rpsHost.room.code}/actions`,{method:'POST',token:rpsGuest.playerToken,body:{expectedVersion:guestView.room.version,type:'choose',choice:'scissors'}});
          if(reveal?.room?.state?.phase!=='revealed')throw new Error('RPS did not reveal after both choices');
          if(reveal?.room?.state?.choices?.[hostPlayerId]!=='rock'||reveal?.room?.state?.choices?.[guestPlayerId]!=='scissors')throw new Error('RPS reveal contract failed');
          if(reveal?.room?.state?.roundWinner!==hostPlayerId)throw new Error('RPS winner resolution failed');

          const dominoHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'domino',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(dominoHost?.room?.code||''))throw new Error('Domino room code contract failed');
          const dominoGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:dominoHost.room.code,learnerId:'khaled'}});
          if(dominoGuest?.room?.status!=='playing')throw new Error('Domino join contract failed');
          if(dominoGuest?.room?.state?.hands||dominoGuest?.room?.state?.boneyard)throw new Error('Domino private tiles leaked');
          if(dominoGuest?.room?.state?.board?.length!==1)throw new Error('Domino automatic opening move failed');
          if(dominoGuest?.room?.state?.boneyardCount!==14)throw new Error('Domino boneyard count contract failed');
          const dominoCounts=Object.values(dominoGuest?.room?.state?.handCounts||{}).sort((a,b)=>a-b);
          if(JSON.stringify(dominoCounts)!=='[6,7]')throw new Error(`Domino post-opening hand counts failed: ${JSON.stringify(dominoCounts)}`);

          const dominoHostView=await request(`/v1/games/rooms/${dominoHost.room.code}`,{token:dominoHost.playerToken});
          const opening=dominoHostView?.room?.state?.board?.[0];
          if(!opening||dominoHostView?.room?.state?.currentPlayerId===opening.playedBy)throw new Error('Domino turn did not advance after automatic opener');
          if(dominoHostView?.room?.state?.hands||dominoHostView?.room?.state?.boneyard)throw new Error('Domino host projection leaked private state');

          const currentPlayerId=dominoHostView.room.state.currentPlayerId;
          const currentIsHost=currentPlayerId===dominoHostView.room.selfPlayerId;
          const currentView=currentIsHost?dominoHostView:dominoGuest;
          const currentToken=currentIsHost?dominoHost.playerToken:dominoGuest.playerToken;
          const currentState=currentView.room.state;
          const ends=[currentState.leftEnd,currentState.rightEnd];
          const playable=(currentState.hand||[]).find(tile=>tile.split('-').map(Number).some(value=>ends.includes(value)));
          if(playable){
            const values=playable.split('-').map(Number);
            const side=values.includes(currentState.leftEnd)?'left':'right';
            const dominoPlayed=await request(`/v1/games/rooms/${dominoHost.room.code}/actions`,{method:'POST',token:currentToken,body:{expectedVersion:currentView.room.version,type:'play',tileId:playable,side}});
            if(dominoPlayed?.room?.state?.board?.length!==2)throw new Error('Domino legal classic move failed');
          }else{
            const dominoDrawn=await request(`/v1/games/rooms/${dominoHost.room.code}/actions`,{method:'POST',token:currentToken,body:{expectedVersion:currentView.room.version,type:'draw'}});
            if(dominoDrawn?.room?.state?.boneyardCount!==13)throw new Error('Domino classic draw failed');
          }

          const familyWordHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'family-word-categories',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(familyWordHost?.room?.code||''))throw new Error('Family word room code contract failed');
          const familyWordGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:familyWordHost.room.code,learnerId:'khaled'}});
          if(familyWordGuest?.room?.status!=='waiting'||familyWordGuest?.room?.players?.length!==2)throw new Error('Family word join contract failed');
          const configured=await request(`/v1/games/rooms/${familyWordHost.room.code}/actions`,{method:'POST',token:familyWordHost.playerToken,body:{expectedVersion:familyWordGuest.room.version,type:'configure',durationSec:60,roundsTotal:3}});
          const started=await request(`/v1/games/rooms/${familyWordHost.room.code}/actions`,{method:'POST',token:familyWordHost.playerToken,body:{expectedVersion:configured.room.version,type:'start'}});
          if(started?.room?.status!=='playing'||!started?.room?.state?.letter)throw new Error('Family word shared round did not start');
          const letter=started.room.state.letter;
          const answers={person:`${letter}لف`,animal:`${letter}لف`,plant:`${letter}لف`,object:`${letter}لف`,country:`${letter}لف`};
          const hostSubmit=await request(`/v1/games/rooms/${familyWordHost.room.code}/actions`,{method:'POST',token:familyWordHost.playerToken,body:{expectedVersion:started.room.version,type:'submit',answers}});
          const guestPrivate=await request(`/v1/games/rooms/${familyWordHost.room.code}`,{token:familyWordGuest.playerToken});
          if(guestPrivate?.room?.state?.submissions?.[familyWordHost.room.selfPlayerId])throw new Error('Family word private answers leaked before reveal');
          if(!(guestPrivate?.room?.state?.submittedPlayers||[]).includes(familyWordHost.room.selfPlayerId))throw new Error('Family word submitted status missing');

          console.log(`Production games smoke passed: XO ${xoHost.room.code}, RPS ${rpsHost.room.code}, Domino ${dominoHost.room.code}, Family Word ${familyWordHost.room.code}.`);
          NODE
