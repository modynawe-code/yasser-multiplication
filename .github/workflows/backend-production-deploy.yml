name: Backend Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
      API_BASE: https://yasser-khaled-family-api.modynawe.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Apply production D1 migrations
        run: npx --yes wrangler@4.129.0 d1 migrations apply yasser-khaled-family --remote --config wrangler.jsonc
        working-directory: backend

      - name: Deploy production Worker
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.jsonc
        working-directory: backend

      - name: Production health and games smoke tests
        run: |
          node <<'NODE'
          const base=process.env.API_BASE;
          async function request(path,{method='GET',body,token}={}){
            const headers={accept:'application/json',origin:'capacitor://localhost'};
            if(body!==undefined)headers['content-type']='application/json';
            if(token)headers['x-game-token']=token;
            const response=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            let payload=null;try{payload=await response.json();}catch{}
            if(!response.ok)throw new Error(`${method} ${path} -> ${response.status} ${JSON.stringify(payload)}`);
            return payload;
          }
          const health=await request('/health');
          if(health?.ok!==true)throw new Error('Production health payload is not ok');

          // Existing XO two-device contract must remain intact after the generic-room migration.
          const xoHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'xo',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(xoHost?.room?.code||''))throw new Error('XO room code contract failed');
          if(xoHost?.room?.status!=='waiting'||!xoHost?.playerToken)throw new Error('XO host room contract failed');
          const xoGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:xoHost.room.code,learnerId:'khaled'}});
          if(xoGuest?.room?.status!=='playing'||xoGuest?.room?.players?.length!==2||!xoGuest?.playerToken)throw new Error('XO second-device join contract failed');
          const xoRefreshed=await request(`/v1/games/rooms/${xoHost.room.code}`,{token:xoHost.playerToken});
          if(xoRefreshed?.room?.status!=='playing'||xoRefreshed?.room?.players?.length!==2)throw new Error('XO authenticated room read contract failed');

          // RPS proves the shared room platform supports simultaneous play and private state.
          const rpsHost=await request('/v1/games/rooms',{method:'POST',body:{gameId:'rock-paper-scissors',learnerId:'yasser'}});
          if(!/^\d{6}$/.test(rpsHost?.room?.code||''))throw new Error('RPS room code contract failed');
          const rpsGuest=await request('/v1/games/rooms/join',{method:'POST',body:{code:rpsHost.room.code,learnerId:'khaled'}});
          if(rpsGuest?.room?.status!=='playing'||rpsGuest?.room?.state?.phase!=='choosing')throw new Error('RPS join contract failed');
          const hostPlayerId=rpsHost.room.selfPlayerId;
          const guestPlayerId=rpsGuest.room.selfPlayerId;
          const hostChoice=await request(`/v1/games/rooms/${rpsHost.room.code}/actions`,{method:'POST',token:rpsHost.playerToken,body:{expectedVersion:rpsGuest.room.version,type:'choose',choice:'rock'}});
          if(hostChoice?.room?.state?.choices?.[hostPlayerId]!=='rock')throw new Error('RPS host must see its own private choice');
          const guestView=await request(`/v1/games/rooms/${rpsHost.room.code}`,{token:rpsGuest.playerToken});
          if(guestView?.room?.state?.choices?.[hostPlayerId])throw new Error('RPS private choice leaked to opponent');
          if(!(guestView?.room?.state?.chosenPlayers||[]).includes(hostPlayerId))throw new Error('RPS choice readiness was not exposed safely');
          const reveal=await request(`/v1/games/rooms/${rpsHost.room.code}/actions`,{method:'POST',token:rpsGuest.playerToken,body:{expectedVersion:guestView.room.version,type:'choose',choice:'scissors'}});
          if(reveal?.room?.state?.phase!=='revealed')throw new Error('RPS did not reveal after both choices');
          if(reveal?.room?.state?.choices?.[hostPlayerId]!=='rock'||reveal?.room?.state?.choices?.[guestPlayerId]!=='scissors')throw new Error('RPS reveal contract failed');
          if(reveal?.room?.state?.roundWinner!==hostPlayerId)throw new Error('RPS winner resolution failed');

          console.log(`Production games smoke passed: XO ${xoHost.room.code}, RPS ${rpsHost.room.code}, private-state contract intact.`);
          NODE
