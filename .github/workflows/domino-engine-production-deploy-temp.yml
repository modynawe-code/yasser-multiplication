name: Domino Engine Production Deploy Temp

on:
  push:
    branches:
      - feature/product-ui-reference-v1
    paths:
      - .github/workflows/domino-engine-production-deploy-temp.yml

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
      API_BASE: https://yasser-khaled-family-api.modynawe.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
      - name: Deploy production Worker
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.jsonc
        working-directory: backend
      - name: Smoke classic domino engine in production
        run: |
          node <<'NODE'
          const base=process.env.API_BASE;
          async function request(path,{method='GET',body,token}={}){
            const headers={accept:'application/json',origin:'capacitor://localhost'};
            if(body!==undefined)headers['content-type']='application/json';
            if(token)headers['x-game-token']=token;
            const response=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
            let payload=null;try{payload=await response.json();}catch{}
            if(!response.ok)throw new Error(`${method} ${path} -> ${response.status} ${JSON.stringify(payload)}`);
            return payload;
          }
          const health=await request('/health');
          if(health?.ok!==true)throw new Error('health failed');
          const host=await request('/v1/games/rooms',{method:'POST',body:{gameId:'domino',learnerId:'yasser'}});
          const guest=await request('/v1/games/rooms/join',{method:'POST',body:{code:host.room.code,learnerId:'khaled'}});
          const hostView=await request(`/v1/games/rooms/${host.room.code}`,{token:host.playerToken});
          const hs=hostView.room.state,gs=guest.room.state;
          if(hs.board?.length!==1)throw new Error(`expected automatic opening tile, got ${hs.board?.length}`);
          if(hs.boneyardCount!==14)throw new Error(`expected boneyard 14, got ${hs.boneyardCount}`);
          const counts=Object.values(hs.handCounts||{}).sort((a,b)=>a-b);
          if(JSON.stringify(counts)!=='[6,7]')throw new Error(`expected post-opening hands [6,7], got ${JSON.stringify(counts)}`);
          if(hs.currentPlayerId===hs.board[0].playedBy)throw new Error('turn did not advance after automatic opener');
          if(hs.hands||hs.boneyard||gs.hands||gs.boneyard)throw new Error('private domino state leaked');
          const currentIsHost=hs.currentPlayerId===hostView.room.selfPlayerId;
          const view=currentIsHost?hostView:guest;
          const token=currentIsHost?host.playerToken:guest.playerToken;
          const state=view.room.state;
          const ends=[state.leftEnd,state.rightEnd];
          const playable=(state.hand||[]).find(tile=>tile.split('-').map(Number).some(value=>ends.includes(value)));
          if(playable){
            const values=playable.split('-').map(Number);
            const side=values.includes(state.leftEnd)?'left':'right';
            const moved=await request(`/v1/games/rooms/${host.room.code}/actions`,{method:'POST',token,body:{expectedVersion:view.room.version,type:'play',tileId:playable,side}});
            if(moved.room.state.board.length!==2)throw new Error('legal classic move did not append to board');
          }else{
            const drawn=await request(`/v1/games/rooms/${host.room.code}/actions`,{method:'POST',token,body:{expectedVersion:view.room.version,type:'draw'}});
            if(drawn.room.state.boneyardCount!==13)throw new Error('classic draw did not consume one stock tile');
          }
          console.log(`Classic domino production smoke passed in room ${host.room.code}.`);
          NODE
