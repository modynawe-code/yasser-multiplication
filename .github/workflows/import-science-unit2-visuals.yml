name: Import Science Unit 2 Visuals

on:
  push:
    branches: [feature/product-ui-reference-v1]
    paths:
      - '.github/workflows/import-science-unit2-visuals.yml'
      - 'preview-v4/tools/import-science-unit2-visuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-unit2-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-ui-reference-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow requests
      - name: Extract Unit 2 assessment visuals
        run: python preview-v4/tools/import-science-unit2-visuals.py
      - name: Upload crop review sheet
        uses: actions/upload-artifact@v4
        with:
          name: science-unit2-crop-review
          path: /tmp/science-unit2-crop-review.jpg
          retention-days: 3
      - name: Commit Unit 2 visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v4/assets/science/yasser/unit2 preview-v4/src/modules/yasser/science/science-unit2-visuals.generated.js
          if git diff --cached --quiet; then
            echo "Unit 2 visuals already current."
            exit 0
          fi
          git commit -m "chore: vendor science unit 2 assessment visuals"
          git pull --rebase origin feature/product-ui-reference-v1
          git push origin HEAD:feature/product-ui-reference-v1
