name: Family API Browser Probe

on:
  push:
    branches:
      - 'diag/family-api-browser-reachability-20261004'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
    steps:
      - uses: actions/checkout@v4
      - name: Capture production Worker exception
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yasser-khaled-family-api.modynawe.workers.dev"
          ORIGIN="https://modynawe-code.github.io"
          EMAIL="diag-$(date +%s)-$RANDOM@family.invalid"
          PASSWORD="$(openssl rand -hex 16)Aa1"

          timeout 25s npx --yes wrangler@4.129.0 tail yasser-khaled-family-api --format json > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5

          status=$(curl --silent --show-error -o /tmp/body -w "%{http_code}"             -X POST "$BASE/v1/auth/register"             -H "Origin: $ORIGIN"             -H "Content-Type: application/json"             --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "register_status=$status"

          wait $TAIL_PID || true
          echo "=== WORKER TAIL ==="
          cat /tmp/tail.log
