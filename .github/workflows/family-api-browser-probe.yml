name: Family API Browser Probe

on:
  push:
    branches:
      - 'diag/family-api-browser-reachability-20261004'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe valid family registration path
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yasser-khaled-family-api.modynawe.workers.dev"
          ORIGIN="https://modynawe-code.github.io"
          EMAIL="diag-$(date +%s)-$RANDOM@family.invalid"
          PASSWORD="$(openssl rand -hex 16)Aa1"

          status=$(curl --silent --show-error --dump-header /tmp/h -o /tmp/b -w "%{http_code}"             -X POST "$BASE/v1/auth/register"             -H "Origin: $ORIGIN"             -H "Content-Type: application/json"             --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "register_status=$status"
          cat /tmp/h
          cat /tmp/b
          grep -qi "^access-control-allow-origin: $ORIGIN" /tmp/h
          test "$status" = "201"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/b','utf8')); if(!j.token) process.exit(1);"
