name: Family API Browser Probe

on:
  push:
    branches:
      - 'diag/family-api-browser-reachability-20261004'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
    steps:
      - uses: actions/checkout@v4
      - name: Inspect password iteration distribution
        working-directory: backend
        run: npx --yes wrangler@4.129.0 d1 execute yasser-khaled-family --remote --config wrangler.jsonc --command "SELECT password_iterations, COUNT(*) AS account_count FROM parents GROUP BY password_iterations ORDER BY password_iterations;"
