name: Family API Browser Probe

on:
  push:
    branches:
      - 'diag/family-api-browser-reachability-20261004'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cb1e4fe9d46768f7400d427eaecceb49
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production D1 schema
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 d1 migrations list yasser-khaled-family --remote --config wrangler.jsonc
          npx --yes wrangler@4.129.0 d1 execute yasser-khaled-family --remote --config wrangler.jsonc --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('parents','learners','auth_sessions');"
          npx --yes wrangler@4.129.0 d1 execute yasser-khaled-family --remote --config wrangler.jsonc --command "PRAGMA foreign_key_check;"
