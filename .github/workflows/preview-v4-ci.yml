name: Preview V4 CI

on:
  pull_request:
    paths:
      - 'preview-v4/**'
      - 'backend/**'
      - '.github/workflows/preview-v4-ci.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'preview-v4/**'
      - 'backend/**'
      - '.github/workflows/preview-v4-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test learning app
        run: npm test
        working-directory: preview-v4
      - name: Build human voice recording inventory
        run: npm run voice:check
        working-directory: preview-v4
      - name: Test family backend
        run: node --test backend/tests/*.test.mjs
      - name: Package preview for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: preview-v4-visual-qa
          path: preview-v4
          if-no-files-found: error
          retention-days: 1
