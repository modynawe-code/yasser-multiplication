<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص أبعاد مونوبولي</title><style>body{margin:0;background:#dee4e1;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px}button{min-height:40px;padding:6px 12px}iframe{display:block;margin:0 auto;border:1px solid #84968b;background:white;width:390px;height:700px;max-width:100%}p{margin:6px 12px}</style><nav><button data-size="390,700">جوال 390</button><button data-size="360,640">جوال 360</button><button data-size="768,1024">تابلت طولي</button><button data-size="1100,700">تابلت عرضي</button></nav><p>أداة تحقق من عرض التطبيق الحالي داخل إطار بأبعاد محددة؛ لا تحاكي Safari أو جهازًا فعليًا.</p><iframe title="التطبيق للاختبار" src="../index.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';}));</script></html>
